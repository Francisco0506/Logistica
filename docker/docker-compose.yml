# Infraestructura local de Logistica (Laben).
#   docker compose up -d db      -> levanta PostgreSQL
#   docker compose up -d osrm    -> levanta el servidor de rutas (requiere haber
#                                   corrido antes docker/osrm/prepare para bajar
#                                   y procesar el mapa)
#
# Estos archivos SÍ van a GitHub. Las imágenes NO: se descargan solas la primera
# vez. En otra máquina basta instalar Docker, bajar el repo y correr estos mismos
# comandos.

services:
  # ─────────────────────────────────────────────────────────────
  # Base de datos PostgreSQL: la ÚNICA base del backend. Si no está
  # corriendo, el backend truena al arrancar con un mensaje claro. Las
  # credenciales coinciden con los defaults de settings.py, así que
  # funciona sin configurar ningún .env.
  # ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: logistica-db
    environment:
      POSTGRES_DB: laben_routing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # El puerto de AFUERA es 5432 salvo que la máquina ya tenga un Postgres
    # nativo ocupándolo — en Windows pasa seguido, y el conflicto no da error:
    # Docker dice que publicó el puerto, pero las conexiones se van al Postgres
    # de Windows y fallan con "autentificación password falló". Para moverlo,
    # poner DB_PUERTO_HOST=5433 en docker/.env (y el mismo valor en DB_PORT
    # de backend/.env).
    ports:
      - "${DB_PUERTO_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Servidor de rutas OSRM (calles reales, sin depender del público).
  # OJO: --max-table-size 10000 quita el límite de 100 paradas que
  # trae OSRM por defecto (el mismo que hace fallar al servidor
  # público). El puerto local es 5001 porque el 5000 suele estar
  # ocupado. Requiere haber procesado el mapa antes (ver prepare).
  # ─────────────────────────────────────────────────────────────
  osrm:
    # Tag FIJO, no `latest`. Con `latest`, un `docker compose pull` cualquier
    # día cambia el motor de ruteo por debajo y las rutas dejan de coincidir con
    # las de ayer sin que nadie haya tocado nada.
    #
    # TIENE QUE SER LA MISMA que usan docker/osrm/prepare.sh y prepare.ps1: OSRM
    # cambia el formato de sus archivos entre versiones, así que un mapa
    # procesado con una versión y servido con otra no arranca.
    #
    # Y TIENE QUE EXISTIR EN DOCKER HUB. Aquí decía `v5.27.1`, que es una
    # release de GitHub pero NO un tag publicado en Docker Hub (ahí el más nuevo
    # es v5.25.0). En esta máquina no se notó porque el contenedor ya venía
    # corriendo con la imagen vieja, pero en una máquina limpia —la Mac del
    # cliente— `docker compose up` truena con "manifest unknown" y se queda sin
    # servidor de rutas el primer día.
    #
    # Se fija por DIGEST y no por tag: un tag lo pueden re-publicar apuntando a
    # otra imagen, un digest no cambia nunca. Este es OSRM 5.26.0, que es la
    # versión con la que está procesado el mapa de docker/osrm/data. Comprobado
    # que bajar a v5.25.0 NO sirve: "File is incompatible with this version of
    # OSRM: prepared with OSRM 5.26.0 but this is v5.25.0".
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    container_name: logistica-osrm
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/mexico-latest.osrm
    volumes:
      - ./osrm/data:/data
    ports:
      - "5001:5000"
    restart: unless-stopped
    # Comprueba que osrm-routed siga ESCUCHANDO en su puerto.
    #
    # OJO CON LO QUE NO HACE: no distingue un OSRM colgado de uno sano, porque
    # para eso habría que pedirle una ruta de verdad y ESTA IMAGEN NO TRAE NINGÚN
    # CLIENTE HTTP — no hay curl, wget, nc ni python adentro (comprobado). Meter
    # uno significaría construir una imagen propia, y eso es más maquinaria de la
    # que conviene el día del arranque.
    #
    # Antes aquí había un `wget ...` que NUNCA funcionó, por dos razones a la vez:
    # wget no existe en la imagen, y el `;` de la URL de OSRM lo parte `sh` como
    # separador de comandos. O sea que el contenedor salía "unhealthy" siempre,
    # que es peor que no tener healthcheck: quien mira `docker ps` o se asusta de
    # balde, o aprende a ignorar la única señal que debería importarle.
    #
    # 1388 es 5000 en hexadecimal y 0A es el estado LISTEN de /proc/net/tcp.
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1388 .* 0A ' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
